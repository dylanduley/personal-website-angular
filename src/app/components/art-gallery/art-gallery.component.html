<ul class="gallery">
  @for (art of artworks; track art.id) {
    <li class="piece">
      <button
        #frame
        type="button"
        class="frame"
        (click)="open(art, frame)"
        [attr.aria-label]="'View ' + art.title"
      >
        <span class="tape" aria-hidden="true"></span>
        <img
          [src]="art.imageUrl"
          [alt]="art.title + ', ' + art.medium"
          loading="lazy"
          decoding="async"
        />
        <span class="caption">
          <span class="title">{{ art.title }}</span>
          <span class="medium">{{ art.medium }}</span>
        </span>
      </button>
    </li>
  }
</ul>

<dialog
  #dialog
  class="lightbox"
  [attr.aria-label]="selected()?.title"
  (close)="onClosed()"
  (click)="onDialogClick($event)"
>
  @if (selected(); as art) {
    <figure class="comic-card lightbox-card">
      <button type="button" class="close" (click)="close()" aria-label="Close">
        <app-icon name="xmark" />
      </button>
      <img [src]="art.imageUrl" [alt]="art.title" decoding="async" />
      <figcaption>
        <strong>{{ art.title }}</strong>
        <span>{{ art.medium }}</span>
      </figcaption>
    </figure>
  }
</dialog>
