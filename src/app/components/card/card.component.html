<article class="comic-card card">
  <span class="card-accent" aria-hidden="true"></span>

  <h3 class="card-title">{{ title() }}</h3>

  <p class="card-description">{{ description() }}</p>

  @if (tags().length) {
    <div class="card-tags">
      @for (tag of tags(); track tag) {
        <app-tag [label]="tag" />
      }
    </div>
  }
</article>
