<section class="section section--inked experience-section" id="experience">
  <div class="container">
    <app-section-header label="Work & Schooling" header="Experience" align="center" />

    <ol class="timeline">
      @for (item of items; track item.role) {
        <li class="experience-item">
          <div class="logo">
            <img [src]="item.logo" [alt]="item.logoAlt" loading="lazy" decoding="async" />
          </div>

          <div class="comic-card content">
            <span class="period">{{ item.period }}</span>
            <h3 class="role">{{ item.role }}</h3>
            <span class="company">{{ item.org }}</span>
            @if (item.description) {
              <p class="description">{{ item.description }}</p>
            }
          </div>
        </li>
      }
    </ol>
  </div>
</section>
