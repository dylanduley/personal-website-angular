<header class="header">
  <div class="header-left">
    <a routerLink="/" class="brand-link" aria-label="Dylan Duley - Home Page">
      <span class="brand-logo" aria-hidden="true"></span>
    </a>
  </div>

  <div class="header-right">
    <nav class="nav-desktop" aria-label="Main Navigation">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="nav-button"
        >
          <span class="btn-text">{{ link.label }}</span>
        </a>
      }
    </nav>

    <button
      type="button"
      class="nav-button icon-button theme-toggle-btn"
      (click)="theme.toggle()"
      [attr.aria-pressed]="theme.isDark()"
      aria-label="Dark mode"
      title="Toggle dark mode"
    >
      <span class="btn-text">
        <span class="theme-icons">
          <app-icon class="icon-light" name="sun" />
          <app-icon class="icon-dark" name="moon" />
        </span>
      </span>
    </button>

    <button
      type="button"
      class="nav-button icon-button hamburger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMobileMenuOpen()"
      aria-controls="mobile-nav"
      aria-label="Toggle navigation menu"
    >
      <span class="btn-text">
        <app-icon [name]="isMobileMenuOpen() ? 'xmark' : 'bars'" />
      </span>
    </button>
  </div>
</header>

<nav
  id="mobile-nav"
  class="nav-mobile"
  [class.is-open]="isMobileMenuOpen()"
  aria-label="Mobile Navigation Menu"
>
  <div class="nav-mobile-container">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.exact }"
        class="nav-button mobile"
      >
        <span class="btn-text">{{ link.label }}</span>
      </a>
    }
  </div>
</nav>
