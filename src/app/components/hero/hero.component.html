<section class="hero">
  <div class="hero-content">
    <div class="hero-profile-container">
      <img
        class="hero-profile-image"
        src="/assets/images/web/profile.webp"
        alt="Profile picture of Dylan"
        width="190"
        height="190"
        fetchpriority="high"
      />
    </div>

    <div class="hero-description-container">
      <span class="hero-label">Full Stack Software Engineer</span>

      <h1>Dylan Duley</h1>

      <p class="hero-subtitle">
        Hi there, welcome to my website! Here you can get to know me and my experience as a software
        engineer through the jobs, schooling and projects I have worked on. :D
      </p>

      <div class="social-links hero-social-links">
        @for (link of socialLinks; track link.url) {
          <a [href]="link.url" target="_blank" rel="noopener" [attr.aria-label]="link.label">
            <app-icon [name]="link.icon" />
          </a>
        }
      </div>
    </div>
  </div>
</section>
