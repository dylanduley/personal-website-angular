<section class="banner">
  <div class="container banner-inner">
    <div class="banner-text">
      @if (label()) {
        <span class="sticker">{{ label() }}</span>
      }
      <h1>{{ title() }}</h1>
      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>

    <div class="banner-aside">
      <ng-content></ng-content>
    </div>
  </div>
</section>
