<section class="section" id="projects">
  <div class="container">
    <app-section-header
      label="Code"
      header="Featured Projects"
      description="Exciting projects that I have worked on for both work and myself."
    ></app-section-header>

    <div class="project-showcase">
      @for (project of projects; track project.title) {
        <article class="comic-card comic-card--hover project-panel">
          <div class="project-media">
            <img [src]="project.image" [alt]="project.title" loading="lazy" decoding="async" />
          </div>

          <div class="project-content">
            <span class="tag">{{ project.category }}</span>
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>

            @if (project.github || project.site) {
              <div class="social-links project-links">
                @if (project.github) {
                  <a [href]="project.github" target="_blank" rel="noopener" title="GitHub" [attr.aria-label]="project.title + ' on GitHub'">
                    <app-icon name="github" />
                  </a>
                }
                @if (project.site) {
                  <a [href]="project.site" target="_blank" rel="noopener" title="Visit site" [attr.aria-label]="'Visit ' + project.title">
                    <app-icon name="globe" />
                  </a>
                }
              </div>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
