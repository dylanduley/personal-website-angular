<section class="section" id="projects">
  <div class="container">
    <app-section-header
      label="Code"
      [header]="header()"
      description="Things I've built at work and for fun."
    />

    <div class="project-showcase">
      @for (project of projects; track project.title) {
        @let link = project.site ?? project.github;
        <article class="comic-card project-panel">
          @if (link) {
            <a
              class="project-media is-linked"
              [href]="link"
              target="_blank"
              rel="noopener"
              tabindex="-1"
              aria-hidden="true"
            >
              <img
                [src]="project.image"
                [attr.srcset]="project.srcset"
                sizes="(max-width: 760px) 100vw, 380px"
                alt=""
                loading="lazy"
                decoding="async"
              />
            </a>
          } @else {
            <div class="project-media">
              <img
                [src]="project.image"
                [attr.srcset]="project.srcset"
                sizes="(max-width: 760px) 100vw, 380px"
                [alt]="project.title"
                loading="lazy"
                decoding="async"
              />
            </div>
          }

          <div class="project-content">
            <span class="tag">{{ project.category }}</span>
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>

            @if (project.github || project.site) {
              <div class="social-links project-links">
                @if (project.github) {
                  <a
                    [href]="project.github"
                    target="_blank"
                    rel="noopener"
                    title="GitHub"
                    [attr.aria-label]="project.title + ' on GitHub'"
                  >
                    <app-icon name="github" />
                  </a>
                }
                @if (project.site) {
                  <a
                    [href]="project.site"
                    target="_blank"
                    rel="noopener"
                    title="Visit site"
                    [attr.aria-label]="'Visit ' + project.title"
                  >
                    <app-icon name="globe" />
                  </a>
                }
              </div>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
