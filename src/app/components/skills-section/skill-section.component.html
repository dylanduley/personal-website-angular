<section class="skills-section" id="skills">
  <div class="container">

    <app-section-header label="Expertise"
                        header="Skills & Tech"
                        description="The languages, frameworks and tools I use to deploy and create applications."
    ></app-section-header>

    <div class="skills-grid">

      <app-card
        title="Frontend"
        description="UI frameworks and component-driven development."
        [tags]="[
          'Angular',
          'React',
          'TypeScript',
          'JavaScript',
          'HTML5',
          'SCSS',
          'CSS',
          'Storybook',
          'Tailwind CSS'
        ]">
      </app-card>

      <app-card
        title="Backend"
        description="Scalable APIs, authentication systems, and server-side architecture."
        [tags]="[
          'Java',
          'Node.js',
          'NestJS',
          'Spring Boot',
          'REST APIs'
        ]">
      </app-card>

      <app-card
        title="Cloud & DevOps"
        description="Deploying, automating, and scaling applications."
        [tags]="[
          'Docker',
          'AWS',
          'Azure',
          'GitHub Actions',
          'CI/CD'
        ]">
      </app-card>

      <app-card
        title="Databases & Data Modeling"
        description="Designing relational schemas and optimizing queries."
        [tags]="[
          'PostgreSQL',
          'MySQL',
          'SQL Server'
        ]">
      </app-card>

      <app-card
        title="Programming Languages"
        description="Used across frontend and backend systems."
        [tags]="[
          'Java',
          'TypeScript',
          'JavaScript',
          'Python'
        ]">
      </app-card>

      <app-card
        title="UI & Styling Systems"
        description="Utility-first CSS and scalable styling."
        [tags]="[
          'CSS',
          'SCSS',
          'Tailwind CSS'
        ]">
      </app-card>

    </div>

  </div>
</section>
