<section class="section section--dots" id="skills">
  <div class="container">
    <app-section-header
      label="Expertise"
      header="Skills & Tech"
      description="The languages, frameworks and tools I use to deploy and create applications."
    />

    <div class="skills-grid">
      @for (group of skillGroups; track group.title) {
        <app-card [title]="group.title" [description]="group.description" [tags]="group.tags" />
      }
    </div>
  </div>
</section>
