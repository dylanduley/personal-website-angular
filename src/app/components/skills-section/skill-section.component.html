<section class="skills-section" id="skills">
  <div class="container">

    <app-section-header label="Expertise"
                        header="Skills & Tech"
                        description="The languages, frameworks and tools I use to deploy and create applications."
    ></app-section-header>

    <div class="skills-grid">

      <app-card
        title="Full-Stack Development"
        description="Building scalable web applications with modern frontend frameworks, backend services, and APIs."
        [tags]="[
          'Angular',
          'React',
          'Next.js',
          'TypeScript',
          'JavaScript',
          'Java',
          'Spring Boot',
          'Node.js',
          'REST APIs'
        ]">
      </app-card>

      <app-card
        title="UI Engineering"
        description="Creating responsive interfaces with component-driven development and scalable styling systems."
        [tags]="[
          'HTML5',
          'SCSS',
          'Tailwind CSS',
          'Storybook',
          'Chromatic',
          'Figma'
        ]">
      </app-card>

      <app-card
        title="Cloud, Data & DevOps"
        description="Deploying, automating, and managing applications with modern infrastructure and databases."
        [tags]="[
          'AWS',
          'Docker',
          'GitHub Actions',
          'CI/CD',
          'PostgreSQL',
          'SQL Server'
        ]">
      </app-card>

    </div>

  </div>
</section>
