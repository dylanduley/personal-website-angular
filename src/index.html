<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dylan Duley</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Dylan Duley, full stack software engineer and artist." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7efe1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a16" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dylan Duley" />
    <meta property="og:image" content="https://www.dylanduley.com/assets/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dylan Duley, full stack software engineer and artist" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/assets/font/InterVariable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- set the theme before the page paints to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
